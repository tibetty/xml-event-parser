name: Feature request
description: Suggest an option, an event form, or support for another kind of XML
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to parse or do that the library does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: The option, signature or output shape you have in mind, if any.
      render: ts
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Another parser or a workaround you use today.
    validations:
      required: false
